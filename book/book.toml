[book]
title = "Onrecord Handbook"
authors = ["David Engelmann"]
language = "en"
multilingual = false
src = "src"

[output.html]
site-url = "/onrecord/"
default-theme = "navy"
preferred-dark-theme = "navy"
additional-css = ["theme/custom.css"]
git-repository-url = "https://github.com/david-engelmann/onrecord"
edit-url-template = "https://github.com/david-engelmann/onrecord/edit/main/book/{path}"

[output.html.search]
enable = true
limit-results = 25
use-boolean-and = true
