[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onrecord"
version = "0.1.0"
description = "Cross-session memory where every memory is a claim with receipts"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
onrecord = "onrecord.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
