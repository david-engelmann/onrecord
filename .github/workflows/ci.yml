name: ci

permissions:
  contents: read

on:
  push:
  pull_request:
  merge_group:

jobs:
  gate:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Codepoint scan (Unix)
        if: runner.os != 'Windows'
        run: python3 scripts/codepoint_scan.py
      - name: Codepoint scan (Windows)
        if: runner.os == 'Windows'
        run: python scripts/codepoint_scan.py
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
