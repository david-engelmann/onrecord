[package]
name = "onrecord"
version = "0.1.0"
edition = "2021"
description = "Cross-session memory where nothing is stored as a bare fact: every memory is a claim on the record, carrying who asserted it, when, the evidence behind it, and the chain of claims it superseded."
license = "MIT"

[lib]
name = "onrecord"
path = "src/lib.rs"

[[bin]]
name = "onrecord"
path = "src/main.rs"

[dependencies]
flighttape = { git = "https://github.com/david-engelmann/flighttape", rev = "74a83298aeb31c82e62b9fb0c613f5bc8600799e" }
sha2 = "0.10"
